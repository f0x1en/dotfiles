# general
set -g mouse on
set -g history-limit 100000
set -g status-position bottom

# set leader C-Space 
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# true color
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",xterm-kitty:RGB"

# leader + r, reload
bind r source-file ~/.tmux.conf

# alt + hjkl, change split
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# alt + HJKL, resize split
bind -n M-H resize-pane -L 10
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 10

# leader + [, copy mode
set -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
set -s copy-command 'wl-copy'

# start panes at 1
set -g base-index 1
set -g pane-base-index 1

# cursor shape
set -g cursor-style block

# status bar: Campbell
set -g status-right ""
set -g status-style "bg=#0C0C0C,fg=#6B6B6B"
set -g status-left-length 30
set -g status-left "#[fg=#B8B8B8,bold] #S #[fg=#2A2A2A]│#[default] "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#D4D4D4,bg=#242424] #I #W "
set -g window-status-separator ""
set -g pane-border-style "fg=#242424"
set -g pane-active-border-style "fg=#707070"
set -g message-style "bg=#242424,fg=#D4D4D4"
set -g message-command-style "bg=#242424,fg=#D4D4D4"
set -g mode-style "bg=#2A2A2A,fg=#D4D4D4"

# options
set -g renumber-windows on

# pass images through
set -g allow-passthrough on
set -g visual-activity off
set -g focus-events on

# plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'

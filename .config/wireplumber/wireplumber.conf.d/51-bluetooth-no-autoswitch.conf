# Keep Bluetooth headphones in A2DP (stereo, good quality).
# Default: when an app opens a mic (e.g. game voice chat), WirePlumber switches
# the headset to HSP/HFP (mono, 16 kHz call quality) and music sounds terrible.
# Apps then use the laptop mic instead. Headset mic still possible by hand:
#   pactl set-card-profile bluez_card.<MAC> headset-head-unit
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}

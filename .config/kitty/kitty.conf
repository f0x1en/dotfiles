# kitty config: only settings that differ from defaults.
# Full reference: `kitty +runpy 'from kitty.config import *; print(commented_out_default_config())'`

# BEGIN_KITTY_THEME
## Campbell
## include current-theme.conf
include themes/campbell.conf

# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font"
font_size	12.0
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# padding: vertical, horizontal
window_padding_width 12 16

cursor_blink_interval 0
confirm_os_window_close 0
shell_integration no-cursor

# disable left mouse open link
mouse_map left click ungrabbed

allow_remote_control socket-only
listen_on unix:/tmp/kitty

# scrollback in Neovim
action_alias kitty_scrollback_nvim kitten /home/user/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
map kitty_mod+h kitty_scrollback_nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output

# --- Campbell: quiet window borders, no bell flash ---
active_border_color   #707070
inactive_border_color #242424
bell_border_color     #D1A34D
draw_minimal_borders  yes
enable_audio_bell     no
visual_bell_duration  0

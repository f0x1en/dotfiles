<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <!-- Persian/Arabic fallback for Inter -->
 <alias>
  <family>Inter</family>
  <prefer>
   <family>Inter</family>
   <family>Vazirmatn</family>
   <family>Noto Sans Arabic</family>
  </prefer>
 </alias>
 <!-- Same fallback chain for generic sans-serif -->
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>Inter</family>
   <family>Vazirmatn</family>
   <family>Noto Sans Arabic</family>
  </prefer>
 </alias>
 <dir>~/.local/share/fonts</dir>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>

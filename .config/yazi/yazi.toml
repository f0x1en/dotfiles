[mgr]
ratio = [1, 3, 4]
show_hidden = false
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"

[preview]
max_width = 1000
max_height = 1000

[opener]
edit = [
    { run = 'kitty --title nvim nvim %s', orphan = true, desc = "Edit" }
]

image = [
    { run = 'imv-wayland %s', orphan = true, desc = "View image" }
]

pdf = [
    { run = 'zathura %s', orphan = true, desc = "View PDF" }
]

play = [
    { run = 'mpv %s', orphan = true, desc = "Play media" }
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { mime = "image/gif", use = "play" },
    { mime = "image/*", use = "image" },
    { mime = "application/pdf", use = "pdf" },
    { mime = "video/*", use = "play" }
]
